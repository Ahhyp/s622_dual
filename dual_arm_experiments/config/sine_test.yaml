# sine_test.yaml — ServoJ 动态跟踪测试配置
# 用法: python3 scripts/sine_tracking_test.py --ros-args --params-file config/sine_test.yaml
# 注意: command_rate 按环境实际 controller_manager update_rate 设置:
#   真机 real_controllers.yaml  = 500 Hz
#   单臂仿真 ros2_controllers.yaml = 200 Hz
#   双臂仿真 dual_arm_controllers.yaml = 100 Hz

arm: left
joint: left_j1

# ---- controller 全部关节（轨迹必须覆盖全部，JTC allow_partial_joints_goal=false）----
# 单臂仿真/真机: [j1,j2,j3,j4,j5,j6]
# 双臂仿真 left: [left_j1,left_j2,left_j3,left_j4,left_j5,left_j6]
controller_joints: [j1, j2, j3, j4, j5, j6]

# ---- 轨迹参数 ----
amplitude_rad: 0.05          # A ≈ 2.86°
frequency_hz: 0.5            # 正弦频率（往复频率，非指令频率）
duration_sec: 20.0           # 时长（0.5Hz 至少 10~20 周期）
# center_rad: NaN（默认）= 读 /joint_states 当前值；指定数值则固定中心（如 0.0）
# 注意：yaml 里不要写 null（rclpy 类型冲突），需要固定中心时写数值
center_rad: nan

# ---- 控制链 ----
# 真机: /robot_arm_controller   单臂仿真: /robot_arm_controller   双臂仿真: /left_arm_controller
controller: /robot_arm_controller
trajectory_sample_rate_hz: 200.0       # 指令点密度 = CM update_rate（JTC 插值频率）
joint_states_topic: /joint_states

# ---- 记录 ----
csv_path: /home/yep/my_S622/dual_arm_experiments/results/gazebo/left_j1_0.5hz.csv
warmup_cycles: 2             # 分析时舍弃的前 N 个周期

# ---- 安全 ----
use_sim_time: true           # Gazebo 必须 true；真机 false
