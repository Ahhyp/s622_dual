# dual_sync_test.yaml — 双臂同步测试（左右臂执行相同正弦轨迹，同一时刻发送）
# 用法: python3 scripts/sine_tracking_test.py --ros-args \
#   -p controllers_yaml:=config/dual_sync_test.yaml \
#   -p frequency_hz:=0.5 -p duration_sec:=20.0 -p command_rate_hz:=100.0 \
#   -p csv_path:=results/gazebo/dual_j1_0.5hz.csv -p use_sim_time:=true

controllers:
  - name: /left_arm_controller
    joints: [left_j1]                       # 运动关节（正弦）
    ctrl_joints: [left_j1, left_j2, left_j3, left_j4, left_j5, left_j6]
  - name: /right_arm_controller
    joints: [right_j1]
    ctrl_joints: [right_j1, right_j2, right_j3, right_j4, right_j5, right_j6]
