    - "§6 每一步的文件修改范围（W4：新建 2）"
    - "§7 测试矩阵与量化验收标准（S4-T1 .. S4-T22）"
    - "§7.1 每步对应哪些用例"
  w4_plan: "docs/双臂协同/双臂协同运动控制与优化/C4.3_S4_W4_软件范围执行规划_20261028.md"
  w4_plan_role: "批次划分与实施顺序；不替代上位冻结契约"
  approved_amendments:
    - id: D2-B
      decided: "2026-10-27"
      source: "docs/双臂协同/双臂协同运动控制与优化/C4.3_S4_审批记录.md"
      changes: "W2-C3 的跨版本 <=1 ULP 判据改为 D2-B 同构建回归判据（由 c3_d2b_gate 执行）；原判据与 7656/7656 FAIL 原样保留为 LEGACY_CROSS_GENERATION_CONTRACT_FAIL_RETAINED。"
      does_not_change: "§7 的任何数值阈值与 Gate 语义"
    - id: D1-B
      decided: "2026-10-27"
      source: "docs/双臂协同/双臂协同运动控制与优化/C4.3_S4_审批记录.md"
      changes: "libdual_arm_qp_core 的新构建基线 sha256 ff95750a... 登记为官方基线；旧 md5 329a3bb3... 保留为历史。"
      does_not_change: "§7 的任何数值阈值与 Gate 语义"

# -----------------------------------------------------------------------------
# 受控词表：批次 B 的检查器应拒绝对这些字段使用词表以外的值。
# -----------------------------------------------------------------------------
status_vocab:
  threshold_status:
    - APPROVED                 # 冻结规划或正式批准修订给出的数值
    - PENDING_CALIBRATION      # 冻结规划显式标 [待标定]，尚无标定依据
    - UNAPPROVED_SOURCE_UNCONFIRMED  # 来源不明，不得自行猜数
  software_state:
    - IMPLEMENTED              # 生产/测试代码已存在且本轮之前已归档
    - PARTIAL                  # 软件覆盖存在，但冻结判据要求的产物或环境不全
    - NOT_IMPLEMENTED          # 本阶段尚未实现（属后续步骤）
    - OUT_OF_SCOPE             # 属 W5–W9 或非软件范围
  evidence_state:
    - PASS                     # 仅限 evidence_ref 明确覆盖的范围
    - PARTIAL                  # 部分证据成立，判据整体未闭合
    - FAIL                     # 有保留的失败证据（不得因新契约删除）
    - HOLD                     # 外部环境阻断，等待合规环境
    - UNVERIFIED               # 无留存可复核证据
    - NOT_RUN                  # 从未执行
    - MISSING_EVIDENCE         # 曾经执行但原始产物已丢失
  gate_state:
    - CLOSED
    - OPEN
    - HOLD
    - BLOCKED_EXTERNAL_ENV
    - UNAPPROVED

separation_rules:
  - id: R1
    rule: "threshold_status 与 evidence_state 必须分别填写；APPROVED 阈值 + NOT_RUN 证据是合法组合。"
  - id: R2
    rule: "threshold 为 [待标定] 时，threshold_status 必须是 PENDING_CALIBRATION。"
  - id: R3
    rule: "evidence_state=PASS 时必须给出可定位的 evidence_ref；ref 指向的文件不存在时应改为 MISSING_EVIDENCE/UNVERIFIED。"
  - id: R4
    rule: "需要原生 Linux RT 或真实硬件的条目不得出现 PASS；其 gate_state 只能是 HOLD / BLOCKED_EXTERNAL_ENV。"
  - id: R5
    rule: "历史 FAIL（W2-C3 原判据 7656/7656）不得被删除或改写为 PASS。"
  - id: R6
    rule: "本文件任何字段的成功都不能被解释为 S4.1 正式验收 PASS。"

# 批次 B：检查器必须确认下列编号全部出现在 entries[].test_id 中（不重不漏）。
