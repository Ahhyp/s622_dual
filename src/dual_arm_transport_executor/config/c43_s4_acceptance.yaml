# =============================================================================
# C4.3 S4 — 验收阈值台账（W4 批次 A）
# =============================================================================
# 本文件是 C4.3 S4 的「阈值台账 / acceptance ledger」。它只在**登记**验收条目、
# 指标、阈值、来源与证据状态；它不执行验收，也不构成任何 PASS 结论。
#
# 生成批次：W4 批次 A（阈值台账）。批次 B 的自动检查脚本
# （scripts/check_acceptance_yaml.py）与批次 C 的集中验证不在本文件范围内。
#
# 三条不可混淆的分离原则（批次 B 必须据此检查）：
#   1. threshold_status=APPROVED  != 该条目的测试已经通过。
#   2. evidence_state=PASS（软件层）!= RT 实时性通过 / 真机通过。
#   3. 本文件结构合法          != S4.1 正式 Gate PASS。
# =============================================================================

schema: c43s4.acceptance_ledger.v1
authored_at: "2026-10-28"
authored_by: "W4 batch A (ledger only)"

purpose: >-
  Machine-readable registry of every acceptance item defined by the frozen
  S4 execution plan (section 7 test matrix, S4-T1 .. S4-T22), with the
  threshold, its approval status, the software state, the evidence state and
  the gate state kept in separate fields so that no single field can be read
  as "the test passed".

scope_notes:
  - "条目集合 = 冻结规划 §7 表内的 S4-T1 .. S4-T22；未新增、未删除任何编号。"
  - "W5–W9 的判据（Gazebo 场景、附着、全流程、度量报告）在 §7 表内已给出编号，本台账登记为 OUT_OF_SCOPE，不实施。"
  - "W2-C3 的 D2-B 判据属 §5 表的 W2 行（不是 §7 的 S4 用例），仅作为已批准修订登记在 contract.approved_amendments。"
  - "本台账不修改任何生产参数、不改冻结阈值、不改 Gate 判据。"

contract:
  frozen_plan: "docs/双臂协同/双臂协同运动控制与优化/C4.3_S4_执行规划.md"
  frozen_plan_sections:
