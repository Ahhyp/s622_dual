# src/yolov8_grasping/config/demo_node.yaml
# Demo 节点（无相机）参数配置
demo_node:
  ros__parameters:
    # ── 运动组 ──
    arm_group_name: "robot_arm"
    hand_group_name: "hand"
    base_frame: "base_link"
    ee_frame: "grasp_frame"
    move_group_ns_fairino: "/move_group_fairino"
    move_group_ready_timeout_sec: 10.0

    # ── 规划器 ──
    planning_pipeline_id: "fairino"
    planner_id: "tube_birrt*"

    # ── 运动学限速 ──
    max_step_size: 0.05
    arm_max_velocity: 0.3
    arm_max_acceleration: 0.3
    allowed_planning_time: 15.0
    position_tolerance: 0.005
    orientation_tolerance: 0.005
    allowed_start_tolerance: 0.1
    action_delay: 0.5

    # ── Home 位姿（关节空间移动到此处）──
    home_pose.x: 0.149
    home_pose.y: 0.327
    home_pose.z: 0.364
    home_pose.roll: -174.091
    home_pose.pitch: 1.040
    home_pose.yaw: -50.0

    # ── 抓取位姿（笛卡尔直线下降目标）──
    grasp_pose.x: 0.149
    grasp_pose.y: 0.327
    grasp_pose.z: 0.164
    grasp_pose.roll: -174.091
    grasp_pose.pitch: 1.040
    grasp_pose.yaw: -50.0

    # ── 夹爪 ──
    gripper_open_positions: [0.0305, -0.0305]
    gripper_close_positions: [0.0, 0.0]

    # ── 轨迹打分 ──
    num_candidate_plans: 5
    wrist_weight: 50.0
    wrist_joint_indices: [2, 3, 4]

    # ── J2 约束（可选）──
    j2_constraint_position: -1.5708
    j2_constraint_tolerance: 1.5708
