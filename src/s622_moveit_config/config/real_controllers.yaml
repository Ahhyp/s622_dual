# 真机控制器配置（2026-08-27 修订）
# 与仿真 ros2_controllers.yaml（velocity 命令接口 + gains PID）不同：
#   真机 fairino_hardware 插件 on_init 强制 position command interface，
#   JTC 直接把参考位置点写给插件（ServoJ 下发），不需要 gains(PID) 段。
#
# 2026-08-27 修订（第 3 版）：对齐 robotarm **生效配置**。
# robotarm ros2_controllers.yaml 实际生效 update_rate: 500（注释"实机100"只是建议，
# 真机验证跑 demo.launch.py 加载的就是 500）。500Hz(2ms) 与插件 ServoJ cmdT=0.0016(1.6ms)
# 接近匹配（速度虚高 1.25 倍）；100Hz(10ms) 虚高 6.25 倍 → 上位机报
# "轴3 关节空间内指令速度超限"、ServoJ ERR_EXECUTION_FAILED(14)。
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz（robotarm 生效值，真机验证过）

    robot_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

robot_arm_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position

hand_controller:
  ros__parameters:
    joints:
      - finger1_joint
      - finger2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
