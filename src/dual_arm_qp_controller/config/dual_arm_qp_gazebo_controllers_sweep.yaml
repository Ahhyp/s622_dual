# C2.9a: Gazebo profile for the QP controller (position command interfaces).
# Selected with:
#   xacro ... arm_command_mode:=position
#   xacro ... controllers_yaml:=<this file>
# NOTE: the arm JTCs are intentionally absent -- the arms are driven by the QP.
controller_manager:
  ros__parameters:
    update_rate: 125          # Hz == QP dt 0.008 s

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    dual_arm_qp_controller:
      type: dual_arm_qp_controller/DualArmQpController
    left_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ---- grippers (kept so the hands stay usable) ----
left_hand_controller:
  ros__parameters:
    joints: [left_finger1_joint, left_finger2_joint]
    command_interfaces: [position]
    state_interfaces: [position]
    allow_partial_joints_goal: true

right_hand_controller:
  ros__parameters:
    joints: [right_finger1_joint, right_finger2_joint]
    command_interfaces: [position]
    state_interfaces: [position]
    allow_partial_joints_goal: true

# ---- the QP controller ----
dual_arm_qp_controller:
  ros__parameters:
    joints:
      - left_j1
      - left_j2
      - left_j3
      - left_j4
      - left_j5
      - left_j6
      - right_j1
      - right_j2
      - right_j3
      - right_j4
      - right_j5
      - right_j6
    dt: 0.008
    kp_rel: 20.0
    kp_obj: 20.0
    w_rel: 1.0
    w_obj: 1.0
    w_slack: 1000.0
    w_slack_obj: 1000.0
    w_center: 0.01
    w_reg: 0.000001
    v_max: 1.0                 # conservative for Gazebo position servo
    tracking_error_limit: 0.0
    solve_failure_limit: 5
    stall_inject_arm: -1
    stall_inject_start_s: -1.0
    stall_inject_duration_s: 0.0
    period_fault_factor: 2.0
    collision_d_stop: 0.0
    collision_link_radius: 0.06
    test_sweep_amp_m: 0.06
    test_sweep_period_s: 4.0
