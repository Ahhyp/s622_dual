# C4.3 S4.1 W2 -- long-run trajectory for §7 S4-T17 (realtime drift / leak).
#
# 17 x (lift +5 cm, lower -5 cm) + 0.04 s settle:
#   17 * 3.00 s + 0.04 s = 51.04 s = 6380 cycles at dt 0.008  (plan §7 S4-T17)
#
# Why not 10 x the ff_1 five-phase block: that block nets -1 cm in z per
# repetition, so ten of them would sink the object 10 cm -- a different
# experiment.  This one is drift-free by construction, which is what a long-run
# resource/realism test needs.
#
# start: from_baseline -> same S2 frozen start as c43_s4_transport.yaml.
dt: 0.008
start: from_baseline
time_scaling: smoothstep
