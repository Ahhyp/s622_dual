# /etc/systemd/system/docker.socket.d/10-kz-acl.conf
# 用途：让 kz 用户无需 docker 组、无需 sudo 就能访问 /var/run/docker.sock。
#
# 背景：docker 组不是"登录时"才生效的，而是进程启动时继承（supplementary groups）。
# DSH 之类的常驻进程在登录那一刻就固定了组列表，之后 usermod -aG docker 不会影响它，
# 于是 agent 里每条 docker 命令都要提权审批。
#
# 安装：
#   sudo install -m 644 -o root -g root \
#     scripts/env/10-docker-socket-acl.conf \
#     /etc/systemd/system/docker.socket.d/10-kz-acl.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart docker.socket   # 会连带重启 docker.service
#
[Socket]
ExecStartPost=/usr/bin/setfacl -m u:kz:rw /run/docker.sock
