# gz_ros2_control declares position_proportional_gain on its own node
# (NOT a URDF hardware param -- that one is silently ignored).
gz_ros2_control:
  ros__parameters:
    position_proportional_gain: 20.0

# C2.9a: Gazebo profile for the QP controller (position command interfaces).
# Selected with:
#   xacro ... arm_command_mode:=position
#   xacro ... controllers_yaml:=<this file>
# NOTE: the arm JTCs are intentionally absent -- the arms are driven by the QP.
controller_manager:
  ros__parameters:
    update_rate: 125          # Hz == QP dt 0.008 s

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    dual_arm_qp_controller:
      type: dual_arm_qp_controller/DualArmQpController
    left_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ---- grippers (kept so the hands stay usable) ----
left_hand_controller:
  ros__parameters:
    joints: [left_finger1_joint, left_finger2_joint]
    command_interfaces: [position]
    state_interfaces: [position]
    allow_partial_joints_goal: true

right_hand_controller:
  ros__parameters:
    joints: [right_finger1_joint, right_finger2_joint]
    command_interfaces: [position]
    state_interfaces: [position]
    allow_partial_joints_goal: true

# ---- the QP controller ----
dual_arm_qp_controller:
  ros__parameters:
    joints:
      - left_j1
      - left_j2
      - left_j3
      - left_j4
      - left_j5
      - left_j6
      - right_j1
      - right_j2
      - right_j3
      - right_j4
      - right_j5
      - right_j6
    dt: 0.008
    kp_rel: 20.0
    # C4.3 S4 W1: the three object-task keys below are now ACTUALLY READ by the
    # controller (before W1 they were declared in this file but never looked up,
    # so the object task was implicitly disabled).  w_obj > 0 with
    # w_slack_obj < 100 is rejected at configure time.
    kp_obj: 20.0
    w_rel: 1.0
    w_obj: 1.0
    w_slack: 1000.0
    w_slack_obj: 1000.0
    # W1: 1e-2 -> 1e-4.  w_center trades step size against tracking accuracy at
    # first order; measured on the S3 transport profile (mock loop, 63 cycles):
    # 1e-2 => max|e_rel| 1.67e-3 (fails a 1 mm promise), 1e-3 => 2.06e-4,
    # 1e-4 => 1.67e-5, 0 => 1.11e-5, while max|dq| moves only 0.1%.  The S3
    # baseline used 1e-4, so S4 uses it too.
    w_center: 0.0001
    w_reg: 0.000001
    v_max: 1.0                 # conservative for Gazebo position servo
    tracking_error_limit: 0.0
    solve_failure_limit: 5
    stall_inject_arm: -1
    stall_inject_start_s: -1.0
    stall_inject_duration_s: 0.0
    period_fault_factor: 2.0
    collision_d_stop: 0.0
    collision_link_radius: 0.06
    test_sweep_amp_m: 0.0
    test_sweep_period_s: 4.0
    # ---- C4.3 S4 W1 review (A/B/D): protection & start-gate parameters -------
    # Every parameter below states WHEN it applies and WHAT IT DOES NOT COVER.
    # The controller publishes this coverage in TransportStatus.protection; it
    # is deliberately a three-value report (implemented / degraded / missing)
    # rather than a boolean "protected" flag.
    #
    # require_executor_heartbeat (default false)
    #   Applies to: the transport executor publishing ~/heartbeat at >= 10 Hz.
    #   Effect when true: heartbeat age > executor_heartbeat_timeout_s latches a
    #     local HOLD with code "executor_lost"; both arms freeze.  Fails closed:
    #     "never received" is treated as stale.
    #   NOT covered: the controller cannot tell a crashed executor from a
    #     graceful stop -- it only sees silence.  S4.1 has no executor at all,
    #     so the default is false and ~/status reports e8 as MISSING.  The RT
    #     latch action itself is only exercised on the mock bench (see the W1
    #     acceptance record); no Gazebo fault injection has been done for it.
    require_executor_heartbeat: false
    executor_heartbeat_timeout_s: 0.1
    #
    # home_q / start_pose_tolerance_rad (default: S2 frozen q_grasp12, 0.05 rad)
    #   Applies to: ~/start_transport.  The anchored start pose of a transport is
    #     T_hat_{O,L}(q_grasp), so starting elsewhere would silently redefine
    #     "where the object is".  max|q_state - home_q| > tolerance is refused
    #     (service response + per-cycle re-check on the control thread).
    #   NOT covered: it only checks the 12 joint values' max deviation, so it
    #     does NOT verify that the arms are collision-free, that the grippers are
    #     open, or that the object is actually between the pads.  tolerance <= 0
    #     disables the check (documented escape hatch, not a supported mode).
    # start_pose_tolerance_rad: 0.05
    #
    # Uncovered protection scenarios (reported, not implemented):
    #   e2_state_staleness -- ros2_control hands values without timestamps; a
    #     failed read returns ERROR, so a frozen-but-finite sensor is NOT
    #     detectable at this layer.  Reported as "degraded".
    #   e7_arm_gap -- disabled while collision_d_stop <= 0; then reported as
    #     "missing" rather than silently assumed to be active.
    #   e4_deadline -- implemented stricter than the plan: a SINGLE measured
    #     period overrun latches HOLD (the plan allowed 5 consecutive).
